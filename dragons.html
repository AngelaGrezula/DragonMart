<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon List – DragonMart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="dl-header">
        <h2 class="logo">DragonMart</h2>
        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="index.html#about-section">About</a>
            <a href="dragons.html" class="active">Dragons</a>
            <a href="shop.html">Shop</a>
        </nav>
    </header>

    <section class="dragons-list" style="padding-top:100px;">
        <h2 style="text-align: center;">Dragon’s List</h2>
        <p style="text-align: center;">
            Explore all dragons available at DragonMart. Select a dragon to learn more.
        </p>

        <!-- you can copy your slider here or replace with grid later -->
        <div class="slider-container">
            <div class="slider-track" id="slider-track">
                <!-- COPY ALL slide-item from index.html here -->
                 <div class="slide-item active" data-name="Night Fury">
                    <img src="./assets/slider-imgs/toothless.png" alt="Night Fury">
                </div>

                <div class="slide-item" data-name="Light Fury">
                    <img src="./assets/slider-imgs/lightfury.png" alt="Light Fury">
                </div>

                <div class="slide-item" data-name="Stormfly">
                    <img src="./assets/slider-imgs/stormfly.png" alt="Stormfly">
                </div>

                <div class="slide-item" data-name="Armorwing">
                    <img src="./assets/slider-imgs/armorwing.png" alt="Armorwing">
                </div>


                <div class="slide-item" data-name="Barf & Belch">
                    <img src="./assets/slider-imgs/barf&belch.png" alt="Barf & Belch">
                </div>

                <div class="slide-item" data-name="Death Song">
                    <img src="./assets/slider-imgs/death_song.png" alt="Death Song">
                </div>

                <div class="slide-item" data-name="Dragos Bewilderbeast">
                    <img src="./assets/slider-imgs/dragos_bewilderbeast.png" alt="Dragos Bewilderbeast">
                </div>

                <div class="slide-item" data-name="Dramillion">
                    <img src="./assets/slider-imgs/dramillion.png" alt="Dramillion">
                </div>


                <div class="slide-item" data-name="Night Terror">
                    <img src="./assets/slider-imgs/night_terror.png" alt="Night Terror">
                </div>

              
                <div class="slide-item" data-name="Skrill">
                    <img src="./assets/slider-imgs/skrill.png" alt="Skrill">
                </div>

                <div class="slide-item" data-name="Skullcrusher">
                    <img src="./assets/slider-imgs/skullcrusher.png" alt="Skullcrusher">
                </div>

                <div class="slide-item" data-name="snaptrapper">
                    <img src="./assets/slider-imgs/snaptrapper.png" alt="Snaptrapper">
                </div>

                <div class="slide-item" data-name="Terrible Terror">
                    <img src="./assets/slider-imgs/terrible_terror.png" alt="Terrible Terror">
                </div>

                <div class="slide-item" data-name="Thunderdrum">
                    <img src="./assets/slider-imgs/thunderdrum.png" alt="Thunderdrum">
                </div>

                <div class="slide-item" data-name="Whispering Death">
                    <img src="./assets/slider-imgs/whispering_death.png" alt="Whisperingdeath">
                </div>

            </div>

            <div class="click-left"></div>
            <div class="click-right"></div>
        </div>

        <div class="dragon-info-viewer">
            <h3 id="dragon-specie" style="text-align: center;">Night Fury</h3>
            <p id="dragon-desc" style="text-align: center; margin: 20px auto; max-width: 600px;"></p>

            <div style="max-width: 800px; margin: 0 auto;">
                <div id="stats" class="stats"></div>
            </div>
        </div>

    </section>

        <audio id="dragon-select-sound" src="./assets/sounds/sounds_effect.mp3" preload="auto"></audio>
    
        <audio id="background-music" src="./assets/sounds/ambiance.mp3" preload="auto" loop></audio> 

        <script src="main.js"></script>

</body>
</html>
